# =============================================================================
# Nginx reverse proxy for Kredo Portal Backend
# Place at: /etc/nginx/sites-available/kredo-api
# Symlink:  ln -s /etc/nginx/sites-available/kredo-api /etc/nginx/sites-enabled/
# =============================================================================

# Rate limiting zone — 30 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Upstream — points to PM2 cluster
upstream kredo_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;  # ← CHANGE THIS

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;  # ← CHANGE THIS

    # ---------- SSL (Certbot / Let's Encrypt) ----------
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;   # ← CHANGE THIS
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;     # ← CHANGE THIS
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- Security headers ----------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---------- Gzip ----------
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 256;

    # ---------- Request size limit ----------
    client_max_body_size 10m;

    # ---------- Proxy to NestJS ----------
    location / {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass         http://kredo_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Block common exploit paths
    location ~ /\. {
        deny all;
    }
}
